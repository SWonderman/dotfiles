###############################################################################
# Behaviour
###############################################################################

# Use the login shell tmux was started from
set-option -g default-shell $SHELL

# tmux-256color + truecolor / clipboard passthrough
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB,alacritty:RGB,*256col*:RGB"
set-option -sa terminal-features ",xterm-256color:clipboard"

set -g mouse on                     # scroll, resize panes, click to focus
set -s set-clipboard on             # OSC 52 clipboard sync

setw -g mode-keys vi
setw -g xterm-keys on

set -s escape-time 10               # snappier ESC in vim/nvim
set -sg repeat-time 600             # longer window for repeatable (-r) keys
set -s focus-events on              # let vim/nvim notice focus changes
setw -q -g utf8 on

set -g history-limit 100000         # scrollback

# 1-indexed windows/panes are easier to hit on the number row
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
setw -g aggressive-resize on

set -g display-panes-time 800       # pane-number overlay lingers a bit
set -g display-time 1000            # status messages linger a bit
set -g status-interval 5            # redraw status line every 5s

# Activity — stay quiet
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

###############################################################################
# Resurrect / Continuum (session save & restore)
###############################################################################

set -g @resurrect-dir "$tmux_dir/resurrect"
set -g @resurrect-save "S"                    # prefix-S saves the environment
set -g @resurrect-restore "R"                 # prefix-R restores it
set -g @resurrect-strategy-nvim "session"     # restore a Session.vim if present
set -g @continuum-restore "on"                # auto-restore the last save on start
