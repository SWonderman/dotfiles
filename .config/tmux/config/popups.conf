###############################################################################
# fzf popups (Tier 2)
#
# Every popup runs through fzf-popup.sh, which dims the background while open.
# Two multi-key tables plus a couple of direct bindings:
#   prefix + t  → tmux  (panes, sessions, files, search)
#   prefix + g  → git   (branch, log, stash)
#   prefix + K  → kill a process        prefix + N → listening ports
#   prefix + ?  → this cheat sheet
###############################################################################

%hidden WRAP="~/.config/tmux/scripts/fzf-popup.sh"

# --- Direct bindings ---------------------------------------------------------

# prefix-K - Fuzzy find and kill a process
bind K display-popup -T '#[align=centre] Kill Process ' -E -w 80% -h 80% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-kill-process.sh"
# prefix-N - Listening ports (kill the owner)
bind N display-popup -T '#[align=centre] Ports ' -E -w 80% -h 80% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-ports.sh"

# --- tmux table (prefix + t) -------------------------------------------------
bind t switch-client -T tmux-popup

# prefix-tp - Switch pane (fuzzy)
bind -T tmux-popup p display-popup -T '#[align=centre] Switch Pane ' -E -w 50% -h 50% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-switch-pane.sh"
# prefix-ts - Sessions (Enter switch / Ctrl-X kill / Ctrl-A new / Ctrl-R rename)
bind -T tmux-popup s display-popup -T '#[align=centre] Sessions ' -E -w 50% -h 50% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-sessions.sh"
# prefix-te - Sessionizer (fuzzy-jump to a project dir)
bind -T tmux-popup e display-popup -T '#[align=centre] Sessionizer ' -E -w 60% -h 60% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/tmux-sessionizer.sh"
# prefix-tn - New session (prompts for a name)
bind -T tmux-popup n command-prompt -p "New session:" "new-session -d -s '%%' ; switch-client -t '%%'"
# prefix-tt - Toggle the status bar
bind -T tmux-popup t set-option status
# prefix-tf - Edit file (from the pane's cwd)
bind -T tmux-popup f run-shell 'rm -f /tmp/tmux-fzf-result' \; display-popup -T '#[align=centre] File ' -d '#{pane_current_path}' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-edit-file.sh" \; run-shell '~/.config/tmux/scripts/fzf-open-result.sh'
# prefix-th - Edit file (from $HOME)
bind -T tmux-popup h run-shell 'rm -f /tmp/tmux-fzf-result' \; display-popup -T '#[align=centre] Home File ' -d '~' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-edit-file.sh" \; run-shell '~/.config/tmux/scripts/fzf-open-result.sh'
# prefix-tg - Search with ripgrep (live, type to filter)
bind -T tmux-popup g run-shell 'rm -f /tmp/tmux-fzf-result' \; display-popup -T '#[align=centre] Grep ' -d '#{pane_current_path}' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-rg.sh" \; run-shell '~/.config/tmux/scripts/fzf-open-result.sh'

# --- git table (prefix + g) --------------------------------------------------
bind g switch-client -T git

# prefix-gb - Branch switcher (recent-first, log preview)
bind -T git b display-popup -T '#[align=centre] Git Branch ' -d '#{pane_current_path}' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-git-branch.sh"
# prefix-gl - Log browser (Enter: view diff, Ctrl-O: checkout)
bind -T git l display-popup -T '#[align=centre] Git Log ' -d '#{pane_current_path}' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-git-log.sh"
# prefix-gs - Stash browser (Enter: apply, Ctrl-D: drop)
bind -T git s display-popup -T '#[align=centre] Git Stash ' -d '#{pane_current_path}' -E -w 90% -h 90% "~/.config/tmux/scripts/fzf-popup.sh ~/.config/tmux/scripts/fzf-git-stash.sh"

# --- Cheat sheet -------------------------------------------------------------

# prefix-? - Show this list of popup keybindings
bind ? display-popup -T '#[align=centre] Keybindings ' -E -w 60% -h 60% "grep -hE '^# prefix' ~/.config/tmux/config/popups.conf | sed 's/^# //' | sort -f | less -R"
