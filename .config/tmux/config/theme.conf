###############################################################################
# Theme (Nord)
###############################################################################
#
# Colors are inlined below (Nord palette). The full palette also lives in
# nord.conf as the reference source of truth for other tools (nvim, sketchybar,
# scripts). tmux's `$var` config expansion proved unreliable across reloads, so
# the values are written out here directly. If you change a color, mirror it in
# nord.conf so the two stay in sync.
#
#   bg #2e3440   fg #ECEFF4   red #bf616a   blue #5e81ac   green #a3be8c
#   magenta #b48ead   grey7 #929cb0   grey10 #616d85   grey11 #464f62
#   grey12 #3a4150   grey13_dark #282e38

# tmux-mode-indicator (status-left badge: TMUX / WAIT / COPY / SYNC)
set -g @mode_indicator_prefix_prompt " WAIT #[default]#[fg=#a3be8c]"
set -g @mode_indicator_prefix_mode_style "bg=#a3be8c,fg=#ECEFF4"
set -g @mode_indicator_copy_prompt " COPY #[default]#[fg=#5e81ac]"
set -g @mode_indicator_copy_mode_style "bg=#5e81ac,fg=#ECEFF4"
set -g @mode_indicator_sync_prompt " SYNC #[default]#[fg=#bf616a]"
set -g @mode_indicator_sync_mode_style "bg=#bf616a,fg=#ECEFF4"
set -g @mode_indicator_empty_prompt " TMUX #[default]#[fg=#3a4150]"
set -g @mode_indicator_empty_mode_style "bg=#3a4150,fg=#929cb0"

# tmux-online-status (the 〇 dot on the right)
set -g @route_to_ping "1.1.1.1"
set -g @online_icon "#[fg=#a3be8c]〇"
set -g @offline_icon "#[fg=#bf616a]〇"

set -g status on
set -g status-justify centre
set -g status-position bottom
set -g status-left-length 90
set -g status-right-length 140
set -g status-style "bg=#2e3440"

# Dim inactive panes slightly (remove these two lines for a flat look)
set -g window-style "fg=#616d85,bg=#282e38"
set -g window-active-style "fg=#ECEFF4,bg=#2e3440"

set -g message-style "bg=#b48ead,fg=#2e3440"
set -g pane-border-style "fg=#464f62"
set -g pane-active-border-style "fg=#b48ead"

# Popup styling (pays off once we add the fzf popups later)
set -g popup-style "bg=#2e3440,fg=#ECEFF4"
set -g popup-border-style "fg=#b48ead"
set -g popup-border-lines rounded
setw -g window-status-separator ""

#################################### FORMAT ####################################
set -g status-left "#{tmux_mode_indicator} "
set -g status-right "#[fg=#464f62]#{online_status}   #[fg=#464f62]%R"

setw -g window-status-format "#[fg=#464f62,nobold,nounderscore,noitalics] #[fg=#464f62] #I #W #[fg=#464f62,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#464f62,nobold,nounderscore,noitalics] #[fg=#b48ead] #I #W #[fg=#464f62,nobold,nounderscore,noitalics]"
