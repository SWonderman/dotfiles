###############################################################################
# Setup
###############################################################################

tmux_dir="~/.config/tmux"
tmux_conf_dir="$tmux_dir/config"
tmux_plugins_dir="$tmux_dir/plugins"

###############################################################################
# Configuration
###############################################################################

source "$tmux_conf_dir/options.conf"
source "$tmux_conf_dir/keybindings.conf"
source "$tmux_conf_dir/popups.conf"
source "$tmux_conf_dir/theme.conf"

###############################################################################
# Plugins (managed by TPM — prefix + I to install, prefix + U to update)
###############################################################################

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$tmux_plugins_dir"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-online-status"
set -g @plugin "MunifTanjim/tmux-mode-indicator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"   # continuum MUST be last

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run "$tmux_plugins_dir/tpm/tpm"
