# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,*256col*:RGB"

set -g mouse on                     # scroll, resize panes, click to focus
set -sg escape-time 10              # snappier ESC in vim/nvim
set -g history-limit 100000         # scrollback
set -g focus-events on              # let vim/nvim notice focus changes
set -g set-clipboard on             # OSC 52 clipboard sync
setw -g aggressive-resize on

# 1-indexed windows/panes are easier to hit on the number row
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Key bindings
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits that keep cwd, with intuitive keys (| and -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable — hold prefix once, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-h previous-window
bind -n M-l next-window

# Copy mode
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left  "#[fg=green,bold] #S #[default]| "
set -g status-right "#[fg=cyan]#(whoami)@#h #[fg=yellow]%Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "

# Activity
setw -g monitor-activity on
set -g visual-activity off
